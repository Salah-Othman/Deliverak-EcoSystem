name: deliverak
repository: https://github.com/your-org/deliverak.git

packages:
  - apps/*
  - packages/*

scripts:
  analyze:
    run: melos exec -- dart analyze --fatal-infos
    description: Run dart analyze on all packages

  test:
    run: melos exec -- flutter test
    description: Run tests across all packages

  format:
    run: melos exec -- dart format --set-exit-if-changed .
    description: Format all Dart files

  customer:android:
    run: melos exec -- flutter run -d android
    package-filter: apps/customer
    description: Run customer app on Android

  customer:ios:
    run: melos exec -- flutter run -d ios
    package-filter: apps/customer
    description: Run customer app on iOS

  driver:android:
    run: melos exec -- flutter run -d android
    package-filter: apps/driver
    description: Run driver app on Android

  driver:ios:
    run: melos exec -- flutter run -d ios
    package-filter: apps/driver
    description: Run driver app on iOS

  vendor:android:
    run: melos exec -- flutter run -d android
    package-filter: apps/vendor
    description: Run vendor app on Android

  vendor:ios:
    run: melos exec -- flutter run -d ios
    package-filter: apps/vendor
    description: Run vendor app on iOS

  admin:web:
    run: melos exec -- flutter run -d chrome
    package-filter: apps/admin
    description: Run admin panel on web

  bootstrap:
    run: melos exec -- dart pub get
    description: Install all dependencies
